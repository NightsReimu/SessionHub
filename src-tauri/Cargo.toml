[package]
name = "sessionhub"
version = "0.1.0"
description = "Unified local session manager for AI coding harnesses"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sessionhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
trash = "5"
dirs = "5"
notify = "6"
thiserror = "1"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
