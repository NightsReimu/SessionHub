name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (aarch64) .dmg/.app
          - os: macos-13 # Intel (x86_64) .dmg/.app
          - os: windows-latest # .msi / .exe (nsis)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SessionHub ${{ github.ref_name }}"
          releaseBody: "下载对应平台的安装包：macOS 选 .dmg（Apple Silicon 选 aarch64，Intel 选 x64），Windows 选 .msi 或 .exe。"
          releaseDraft: true
          prerelease: false
