name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行自动取消，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run build 里也会跑 tsc，这里单独跑一次以拿到独立的失败信号
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  rust:
    # 只在实际发布的平台上验证（见 release.yml：macOS + Windows）。
    # 刻意不加 Linux job：既不发布 Linux，也免得为 webkit2gtk 之类的
    # 系统依赖维护一套只会产生假失败的构建环境。
    # Windows 必须在矩阵里——launch_in_terminal 的 PowerShell 分支只有
    # 在 Windows 上才会被编译。
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all
